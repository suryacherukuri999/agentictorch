# DCGAN on MNIST from eriklindernoren/PyTorch-GAN, with its default settings.
repo = "https://github.com/eriklindernoren/PyTorch-GAN"
commit = "36d3c77e5ff20ebe0aeefd322326a134a279b93e"
command = "cd implementations/dcgan && python dcgan.py"

[data]
dataset = "mnist"
path = "data/mnist"
download = "python -c \"from torchvision.datasets import MNIST; MNIST('.', download=True)\""
