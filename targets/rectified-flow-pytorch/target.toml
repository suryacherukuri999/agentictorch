# rectified-flow-pytorch (lucidrains): the repo's train_oxford.py example, a Unet on
# Oxford Flowers through the library's Trainer.
repo = "https://github.com/lucidrains/rectified-flow-pytorch"
commit = "688cad582422f807adffb32ab8f8bf511fec1e89"
command = "HF_HOME=hf HF_HUB_OFFLINE=1 HF_DATASETS_OFFLINE=1 python train_oxford.py"

[image]
pip = ["accelerate", "einx>=0.3.0", "einops>=0.8.0", "ema-pytorch>=0.5.2", "pillow>=9.4.0", "rotary-embedding-torch>=0.8.9", "scipy", "torch_einops_utils>=0.1.34", "torchdiffeq", "x-transformers>=2.3.21", "x-unet>=0.5.0", "datasets", "fire"]

[data]
dataset = "hf-oxford-flowers"
path = "hf"
download = "HF_HOME=. python -c \"from datasets import load_dataset; load_dataset('nelorth/oxford-flowers')\" && rm -rf xet"
