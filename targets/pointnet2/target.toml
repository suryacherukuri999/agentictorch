# Pointnet_Pointnet2_pytorch (yanx27): PointNet++ classification on a ModelNet40 subset
# (40 training and 10 test shapes per class, so an epoch outlasts the measured steps).
# The hardest target: the slow parts hide in the model's geometry helpers, such as farthest
# point sampling written as a Python loop, not in the training loop.
repo = "https://github.com/yanx27/Pointnet_Pointnet2_pytorch"
commit = "eb64fe0b4c24055559cea26299cb485dcb43d8dd"
command = "tar xf data/modelnet40_normal_resampled/subset.tar -C data/modelnet40_normal_resampled && python train_classification.py --model pointnet2_cls_ssg --log_dir agentictorch"

[image]
pip = ["tqdm", "scipy"]

[data]
# One archive instead of 2,003 files: the volume copies many small files slowly (about
# 10 minutes per run). Each shape keeps its first 1,024 points, the only ones training
# reads (the loader takes point_set[0:1024]). Built from an earlier full-file subset.
dataset = "modelnet40-1024"
path = "data/modelnet40_normal_resampled"
download = '''python -c "
import io, pathlib, tarfile
src = pathlib.Path('/data/modelnet40-subset')
with tarfile.open('subset.tar', 'w') as tar:
    for p in sorted(src.rglob('*.txt')):
        rel = p.relative_to(src)
        data = p.read_bytes()
        if len(rel.parts) > 1:
            data = b''.join(data.splitlines(keepends=True)[:1024])
        info = tarfile.TarInfo(str(rel))
        info.size = len(data)
        tar.addfile(info, io.BytesIO(data))
"'''
