[[case]]
name = "gpt-clean"
script = "char_gpt"
mistake = ""

[[case]]
name = "gpt-manual-attention"
script = "char_gpt"
mistake = "hand-written attention instead of F.scaled_dot_product_attention"
[[case.edit]]
old = '''
        p = self.dropout if self.training else 0.0
        y = F.scaled_dot_product_attention(q, k, v, dropout_p=p, is_causal=True)
'''
new = '''
        scores = (q @ k.transpose(-2, -1)) * q.shape[-1] ** -0.5
        mask = torch.ones(t, t, dtype=torch.bool, device=x.device).tril()
        scores = scores.masked_fill(~mask, float("-inf"))
        y = F.dropout(scores.softmax(dim=-1), self.dropout, self.training) @ v
'''

[[case]]
name = "gpt-cpu-batches"
script = "char_gpt"
mistake = "batches built on the CPU every step"
[[case.edit]]
old = '''
    # The whole dataset is about 1 MB, so it lives on the GPU and batches never touch the CPU.
    train, val = encoded[:split].to(device), encoded[split:].to(device)
'''
new = '''
    train, val = encoded[:split], encoded[split:]
'''
[[case.edit]]
old = '''
        starts = torch.randint(len(data) - args.block - 1, (args.batch_size,), device=device)
        offsets = torch.arange(args.block, device=device)
        x = data[starts[:, None] + offsets]
        y = data[starts[:, None] + offsets + 1]
        return x, y
'''
new = '''
        starts = torch.randint(len(data) - args.block - 1, (args.batch_size,))
        x = torch.stack([data[s : s + args.block] for s in starts])
        y = torch.stack([data[s + 1 : s + 1 + args.block] for s in starts])
        return x.to(device), y.to(device)
'''

[[case]]
name = "gpt-unfused-adamw"
script = "char_gpt"
mistake = "AdamW looping over parameters instead of using the fused kernel"
[[case.edit]]
old = '''
        model.parameters(), lr=1e-3, betas=(0.9, 0.99), weight_decay=0.1, fused=device == "cuda"
'''
new = '''
        model.parameters(), lr=1e-3, betas=(0.9, 0.99), weight_decay=0.1, foreach=False
'''

