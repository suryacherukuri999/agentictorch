# The planted test suite. Each case copies a clean script, bench/<script>/train.py,
# and applies exact edits that plant one mistake. A case without edits is a
# clean control: the agent must not slow it down or change its loss.

[[case]]
name = "resnet-clean"
script = "resnet_cifar"
mistake = ""

[[case]]
name = "resnet-workers0"
script = "resnet_cifar"
mistake = "training DataLoader with num_workers=0"
[[case.edit]]
old = '''
        num_workers=8,
        pin_memory=True,
        persistent_workers=True,
'''
new = '''
        num_workers=0,
        pin_memory=True,
'''

[[case]]
name = "resnet-pageable-copies"
script = "resnet_cifar"
mistake = "no pin_memory and no non_blocking copies"
[[case.edit]]
old = '''
        num_workers=8,
        pin_memory=True,
        persistent_workers=True,
'''
new = '''
        num_workers=8,
        persistent_workers=True,
'''
[[case.edit]]
old = '''
            x = x.to(device, non_blocking=True, memory_format=torch.channels_last)
            y = y.to(device, non_blocking=True)
            with torch.autocast(device, dtype=torch.bfloat16):
'''
new = '''
            x = x.to(device, memory_format=torch.channels_last)
            y = y.to(device)
            with torch.autocast(device, dtype=torch.bfloat16):
'''

