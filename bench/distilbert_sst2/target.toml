# The dataset, tokenizer and weights are cached in the volume and used offline.
command = "TOKENIZERS_PARALLELISM=false HF_HOME=hf HF_HUB_OFFLINE=1 HF_DATASETS_OFFLINE=1 python train.py"
# The scripts validate every 50 steps. Warming up past the first validation keeps its
# one-time costs (worker start-up, cuDNN autotuning for new shapes) out of the window.
warmup = 60

[image]
pip = ["transformers==5.20.2", "datasets==5.1.0"]

[data]
dataset = "hf-sst2"
path = "hf"
download = "HF_HOME=. python -c \"from datasets import load_dataset; from transformers import AutoTokenizer, AutoModelForSequenceClassification; load_dataset('nyu-mll/glue', 'sst2'); AutoTokenizer.from_pretrained('distilbert-base-uncased'); AutoModelForSequenceClassification.from_pretrained('distilbert-base-uncased')\" && rm -rf xet"
