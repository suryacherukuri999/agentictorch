command = "python train.py --data data"
# The scripts validate every 50 steps. Warming up past the first validation keeps its
# one-time work (worker start-up, cuDNN autotuning for new shapes) out of the window.
warmup = 60

[data]
dataset = "cifar10"
path = "data"
download = "python -c \"from torchvision.datasets import CIFAR10; CIFAR10('.', download=True)\" && rm cifar-10-python.tar.gz"
