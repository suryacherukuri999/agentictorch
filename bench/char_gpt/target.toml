command = "python train.py --data data/input.txt"
# The scripts validate every 50 steps. Warming up past the first validation keeps its
# one-time costs (worker start-up, cuDNN autotuning for new shapes) out of the window.
warmup = 60

[data]
dataset = "shakespeare"
path = "data"
download = "python -c \"import urllib.request as r; r.urlretrieve('https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt', 'input.txt')\""
